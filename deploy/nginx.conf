# Refresh Docker DNS when a service is recreated during an update.
resolver 127.0.0.11 valid=10s ipv6=off;
upstream underleaf_backend {
    zone underleaf_backend 64k;
    server backend:3333 resolve;
}
upstream underleaf_frontend {
    zone underleaf_frontend 64k;
    server frontend:3000 resolve;
}
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
    http http;
}
server {
    listen 80;
    server_name _;
    client_max_body_size 20m;
    # Preserve the public origin, including a forwarded HTTPS scheme.
    location /api/ {
        proxy_pass http://underleaf_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
    location = /healthz { proxy_pass http://underleaf_backend; }
    location /openapi { proxy_pass http://underleaf_backend; }
    location / {
        proxy_pass http://underleaf_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
